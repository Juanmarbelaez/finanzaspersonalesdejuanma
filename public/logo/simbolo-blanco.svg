    <title id="titulo">Plata de Juanma — 20° — Plano blanco</title><desc id="descripcion">S inclinada 20 grados a la derecha. Acabado Plano blanco. Curva y flecha originales sin modificar: mismos trazados y grosor 12. Montserrat Bold, tracking -50. Fondo exterior transparente.</desc>
