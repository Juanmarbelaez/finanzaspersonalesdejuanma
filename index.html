    <title>Plata de Juanma</title>
    <style>
      html,
      body {
        background: #000;
      }
    </style>
    <script>
      // Aplica el tema guardado antes de pintar, para que no haya destello
      try {
        var t = JSON.parse(localStorage.getItem('plata') || '{}').state.settings.theme
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        if (t) document.documentElement.dataset.theme = t
        if (t === 'light') document.documentElement.style.background = '#f5f5f5'
      } catch (e) {}
    </script>
